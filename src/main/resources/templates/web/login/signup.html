<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="css/color.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login/signup.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <th:block th:replace="~{fragments/header :: header}">  </th:block>
    <section>
        <div class="wrapper">
            <form action="/signup" method="post">
                <h1>회원가입</h1>
                <div class="input_wrapper">
                    <label for="" class="label_text">아이디</label>
                    <input type="text" required name="id">
                </div>
                <div class="input_wrapper">
                    <label for="" class="label_text">비밀번호</label>
                    <input type="password" required name="password">
                </div>
<!--                <div class="input_wrapper">-->
<!--                    <label for="" class="label_text">비밀번호 확인</label>-->
<!--                    <input type="password" required name="passwordCheck">-->
<!--                </div>-->
                <div class="input_wrapper">
                    <label for="" class="label_text">이름</label>
                    <input type="text" required name="name">
                </div>
                <div class="input_wrapper">
                    <label for="" class="label_text">생년월일</label>
                    <input type="date" required name="birth">
                </div>
<!--                <label for="" class="label_text">성별</label>-->
<!--                <div class="radio_wrapper">-->
<!--                    <input type="radio" id="male" name="gender" required>-->
<!--                    <label for="male">남성</label>-->
<!--                    <input type="radio" id="female" name="gender" required>-->
<!--                    <label for="female">여성</label>-->
<!--                </div>-->
                <input type="submit" value="회원가입" class="login_btn">
<!--                <button type="submit" class="login_btn">회원가입</button>-->
            </form>
        </div>
    </section>
    <th:block th:replace="~{fragments/footer :: footer}">  </th:block>
</body>
</html>

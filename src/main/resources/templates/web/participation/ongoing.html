<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- SEO -->
    <title>Ongoing Exibition</title>

    <link rel="shortcut icon" href="images/logo.webp" type="image/x-icon"/>
    <!-- OG (Open Graph Data) -->
    <meta property="og:title" content="전시회 사이트"/>
    <meta property="og:type" content="website"/>
    <!-- <meta property="og:url" content="배포후 생성된 URL" />
    <meta property="og:image" content="배포후에 생성된 이미지 URL" /> -->
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet"/>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/9eb162ac0d.js" crossorigin="anonymous"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="css/participation/ongoing.css"/>
    <!-- Javascript -->
    <script type="module" src="src/main.js" defer></script>
    <script type="module" src="src/projects.js" defer></script>
    <script type="module" src="src/active_menu.js" defer></script>
</head>
<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>
<body>

<main>
    <script src="srccategory.js"></script>

    <!-- Main -->
    <!--진행중인 박람회-->

    <section id="show" class="section_ongoing">
        <div class="max-container">
            <h2 class="title">진행중인 박람회</h2>
            <ul class="categories">
                <li>
                    <button class="category category--selected" data-category="all">
                        All <span class="category__count" th:text="${ALL}">20</span>
                    </button>
                </li>
                <li>
                    <button class="category" data-category="IT">
                        IT <span class="category__count" th:text="${IT_Count}"></span>
                    </button>
                </li>
                <li>
                    <button class="category" data-category="Job">
                        Job <span class="category__count" th:text="${Job_Count}"></span>
                    </button>
                </li>
                <li>
                    <button class="category" data-category="Festival">
                        Festival <span class="category__count" th:text="${Festival_Count}"></span>
                    </button>
                </li>
            </ul>
            <ul class="projects">
                <li th:each="item : ${items}" class="project" th:attr="data-type=${item.type_}">
                    <a th:href="${item.url}" target="_blank">
                        <img th:src="${item.img}" alt="${item.id}" class="project__img"/>
                        <div class="project__metadata">
                            <h3 class="project__title" th:text="${item.title}"></h3>
                            <p><span th:text="${item.start_date}"></span> ~ <span th:text="${item.end_date}"></span></p>
                        </div>
                    </a>
                </li>
            </ul>
        </div>
    </section>


    <!--부스참가 안내-->


    <aside>
        <a class="arrow-up" href="#" title="back to top">
            <i class="fa-solid fa-arrow-up"></i>
        </a>
    </aside>
</main>

</body>
<!-- Footer -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</html>
